  <text x="780" y="450" font-size="11" fill="#FFEDD5" text-anchor="middle">主平台事件 或 ingest 转换结果 ｜ event_id 确定性派生 ｜ 全链路唯一事件模型</text>
  <path d="M 780 462 L 780 474 L 402 474 L 402 486" fill="none" stroke="#EA580C" stroke-width="2.2" marker-end="url(#ao)"/>
  <path d="M 780 462 L 780 474 L 1158 474 L 1158 486" fill="none" stroke="#EA580C" stroke-width="2.2" marker-end="url(#ao)"/>
  <rect x="40" y="490" width="724" height="312" rx="12" fill="#EFF6FF" stroke="#1E40AF" stroke-width="1.8"/>
  <text x="402" y="520" font-size="16" font-weight="700" fill="#1E40AF" text-anchor="middle">威胁警报 Threat Alerts</text>
  <rect x="100" y="534" width="604" height="54" rx="8" fill="#FFFFFF" stroke="#1E40AF" stroke-width="1.2"/>
  <text x="402" y="556" font-size="13.5" font-weight="700" fill="#0F172A" text-anchor="middle">Classifier — 威胁分级</text>
  <text x="402" y="576" font-size="11" fill="#475569" text-anchor="middle">规则引擎预筛 + 模型研判双轨 → 高 / 中 / 低 · confidence · MITRE · 校园误报抑制</text>
  <line x1="402" y1="588" x2="402" y2="606" stroke="#1E40AF" stroke-width="2" marker-end="url(#an)"/>
  <rect x="100" y="610" width="604" height="54" rx="8" fill="#FFFFFF" stroke="#1E40AF" stroke-width="1.2"/>
  <text x="402" y="632" font-size="13.5" font-weight="700" fill="#0F172A" text-anchor="middle">AlertBuilder — 标准化告警报文</text>
  <text x="402" y="652" font-size="11" fill="#475569" text-anchor="middle">attack_type · verdict · 建议处置 · 对齐平台统一协议字段</text>
  <line x1="402" y1="664" x2="402" y2="682" stroke="#1E40AF" stroke-width="2" marker-end="url(#an)"/>
  <rect x="100" y="686" width="604" height="54" rx="8" fill="#FFFFFF" stroke="#1E40AF" stroke-width="1.2"/>
  <text x="402" y="708" font-size="13.5" font-weight="700" fill="#0F172A" text-anchor="middle">Notifier — 告警推送</text>
  <text x="402" y="728" font-size="11" fill="#475569" text-anchor="middle">同步返回 display_md（主对话界面展示）· 可选 webhook</text>
  <rect x="100" y="756" width="604" height="32" rx="8" fill="#FFFFFF" stroke="#EA580C" stroke-width="1.2" stroke-dasharray="5 3"/>
  <text x="402" y="777" font-size="11" fill="#C2410C" text-anchor="middle">min_alert_level — 分析 + 输出双重门槛（低于门槛不告警，parse_error 除外）</text>
  <rect x="796" y="490" width="724" height="312" rx="12" fill="#EFF6FF" stroke="#1E40AF" stroke-width="1.8"/>
  <text x="1158" y="520" font-size="16" font-weight="700" fill="#1E40AF" text-anchor="middle">应急响应 Incident Response</text>
  <rect x="856" y="534" width="604" height="54" rx="8" fill="#FFFFFF" stroke="#1E40AF" stroke-width="1.2"/>
  <text x="1158" y="556" font-size="13.5" font-weight="700" fill="#0F172A" text-anchor="middle">PlaybookGenerator — 处置预案生成</text>
  <text x="1158" y="576" font-size="11" fill="#475569" text-anchor="middle">按等级模板骨架（遏制→根除→恢复→复盘）+ 模型充实 · SUGGESTION / SIMULATION</text>
  <line x1="1158" y1="588" x2="1158" y2="606" stroke="#1E40AF" stroke-width="2" marker-end="url(#an)"/>
  <rect x="856" y="610" width="604" height="54" rx="8" fill="#FFFFFF" stroke="#1E40AF" stroke-width="1.2"/>
  <text x="1158" y="632" font-size="13.5" font-weight="700" fill="#0F172A" text-anchor="middle">Simulator — 模拟推演</text>
  <text x="1158" y="652" font-size="11" fill="#475569" text-anchor="middle">每步生成 [simulated] 结果 · AST 强制零真实命令</text>
  <line x1="1158" y1="664" x2="1158" y2="682" stroke="#1E40AF" stroke-width="2" marker-end="url(#an)"/>
  <rect x="856" y="686" width="604" height="54" rx="8" fill="#FFFFFF" stroke="#1E40AF" stroke-width="1.2"/>
  <text x="1158" y="708" font-size="13.5" font-weight="700" fill="#0F172A" text-anchor="middle">ReportBuilder — 应急响应报告</text>
  <text x="1158" y="728" font-size="11" fill="#475569" text-anchor="middle">主智能体确认指令 Decision(approve / reject) → IncidentReport</text>
  <rect x="856" y="756" width="604" height="32" rx="8" fill="#FFFFFF" stroke="#EA580C" stroke-width="1.2" stroke-dasharray="5 3"/>
  <text x="1158" y="777" font-size="11" fill="#C2410C" text-anchor="middle">SUGGESTION：高危动作需人工确认 ｜ SIMULATION：仅推演，不执行</text>
  <line x1="402" y1="802" x2="402" y2="848" stroke="#94A3B8" stroke-width="1.4" stroke-dasharray="5 3" marker-end="url(#ag)"/>
  <text x="418" y="830" font-size="10.5" fill="#64748B">结果落盘</text>
  <line x1="1158" y1="802" x2="1158" y2="848" stroke="#94A3B8" stroke-width="1.4" stroke-dasharray="5 3" marker-end="url(#ag)"/>
  <text x="1174" y="830" font-size="10.5" fill="#64748B">推理调用</text>
  <rect x="40" y="852" width="724" height="224" rx="12" fill="#1E40AF"/>
  <text x="402" y="886" font-size="16" font-weight="700" fill="#FFFFFF" text-anchor="middle">Storage — JSON 本地持久化</text>
  <rect x="100" y="906" width="604" height="42" rx="8" fill="#FFFFFF"/>
  <text x="128" y="932" font-size="12.5" font-weight="700" fill="#172554" font-family="ui-monospace, monospace">storage/data/alerts/</text>
  <text x="680" y="932" font-size="11.5" fill="#475569" text-anchor="end">ThreatAlert 告警留档</text>
  <rect x="100" y="956" width="604" height="42" rx="8" fill="#FFFFFF"/>
  <text x="128" y="982" font-size="12.5" font-weight="700" fill="#172554" font-family="ui-monospace, monospace">storage/data/playbooks/</text>
  <text x="680" y="982" font-size="11.5" fill="#475569" text-anchor="end">ResponsePlaybook 处置预案</text>
  <rect x="100" y="1006" width="604" height="42" rx="8" fill="#FFFFFF"/>
  <text x="128" y="1032" font-size="12.5" font-weight="700" fill="#172554" font-family="ui-monospace, monospace">storage/data/reports/</text>
  <text x="680" y="1032" font-size="11.5" fill="#475569" text-anchor="end">IncidentReport 应急报告</text>
  <text x="402" y="1066" font-size="11.5" fill="#BFDBFE" text-anchor="middle">原子写 ｜ tir_ 命名空间（独立于主系统数据库）｜ 180 天留档清理</text>
  <rect x="796" y="852" width="724" height="224" rx="12" fill="#FFFFFF" stroke="#1E40AF" stroke-width="2"/>
  <text x="1158" y="886" font-size="16" font-weight="700" fill="#1E40AF" text-anchor="middle">ModelGateway — 推理大脑（DeepSeek-Reasonix-Security）</text>
  <rect x="824" y="906" width="216" height="48" rx="8" fill="#DBEAFE" stroke="#1E40AF" stroke-width="1"/>
  <text x="932" y="928" font-size="13" font-weight="700" fill="#172554" text-anchor="middle">reasonix-cli 通道</text>
  <text x="932" y="946" font-size="10.5" fill="#475569" text-anchor="middle">主通道</text>
  <rect x="1052" y="906" width="216" height="48" rx="8" fill="#DBEAFE" stroke="#1E40AF" stroke-width="1"/>
  <text x="1160" y="928" font-size="13" font-weight="700" fill="#172554" text-anchor="middle">openai-api 通道</text>
  <text x="1160" y="946" font-size="10.5" fill="#475569" text-anchor="middle">备用通道</text>
  <rect x="1280" y="906" width="216" height="48" rx="8" fill="#DBEAFE" stroke="#1E40AF" stroke-width="1"/>
  <text x="1388" y="928" font-size="13" font-weight="700" fill="#172554" text-anchor="middle">mock 通道</text>
  <text x="1388" y="946" font-size="10.5" fill="#475569" text-anchor="middle">测试</text>
  <text x="1158" y="984" font-size="11" fill="#475569" text-anchor="middle">通道健康检查失败 → 自动降级（reasonix-cli → openai-api → mock）</text>
  <rect x="824" y="1000" width="672" height="48" rx="8" fill="#EFF6FF"/>
  <text x="1158" y="1020" font-size="11.5" font-weight="700" fill="#1E40AF" text-anchor="middle">AI 仅用于判断 / 生成处：威胁分级研判 · 预案生成 · 报告生成</text>
  <text x="1158" y="1039" font-size="11" fill="#475569" text-anchor="middle">流程 / 状态 / 存储为确定性业务代码（对齐计划书 3.4 分层原则）</text>
