  <rect x="810" y="1100" width="18" height="18" rx="4" fill="#FFFFFF" stroke="#EA580C" stroke-width="1.4" stroke-dasharray="4 2"/>
  <text x="836" y="1114" font-size="11.5" fill="#475569">安全门控 / 模式约束</text>
  <text x="780" y="1160" font-size="11" fill="#94A3B8" text-anchor="middle">ThreatIRSubAgent v2.0 ｜ 注：两子系统均调用 ModelGateway 完成分级研判与预案/报告生成，产出均经 Storage 持久化（图中示主路径）</text>
