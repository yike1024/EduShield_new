  </defs>
  <rect width="1560" height="1200" fill="#FFFFFF"/>
  <rect x="24" y="24" width="1512" height="68" rx="14" fill="#172554"/>
  <text x="52" y="58" font-size="21" font-weight="700" fill="#FFFFFF">ThreatIRSubAgent</text>
  <rect x="248" y="42" width="92" height="30" rx="15" fill="#FFFFFF"/>
  <text x="294" y="62" font-size="13" font-weight="700" fill="#172554" text-anchor="middle">port 8090</text>
  <text x="368" y="62" font-size="14" fill="#BFDBFE">威胁警报 · 应急响应 子智能体 ｜ edushield 校园智盾平台</text>
  <rect x="1448" y="42" width="56" height="30" rx="15" fill="none" stroke="#93C5FD" stroke-width="1.2"/>
  <text x="1476" y="62" font-size="12.5" fill="#DBEAFE" text-anchor="middle">v2.0</text>
  <rect x="40" y="112" width="1480" height="80" rx="12" fill="#DBEAFE" stroke="#1E40AF" stroke-width="1.5"/>
  <text x="64" y="146" font-size="15" font-weight="700" fill="#1E40AF">接入层</text>
  <text x="64" y="168" font-size="11" fill="#3B82F6">三入口 · 对等</text>
  <rect x="250" y="126" width="400" height="52" rx="8" fill="#FFFFFF" stroke="#1E40AF" stroke-width="1"/>
  <text x="450" y="148" font-size="13.5" font-weight="700" fill="#0F172A" text-anchor="middle">CLI（__main__.py）</text>
  <text x="450" y="167" font-size="11" fill="#475569" text-anchor="middle">ingest-file / serve / playbook / confirm / doctor</text>
  <rect x="674" y="126" width="400" height="52" rx="8" fill="#FFFFFF" stroke="#1E40AF" stroke-width="1"/>
  <text x="874" y="148" font-size="13.5" font-weight="700" fill="#0F172A" text-anchor="middle">HTTP REST（server.py）</text>
  <text x="874" y="167" font-size="11" fill="#475569" text-anchor="middle">/api/tir/* — 10 端点</text>
  <rect x="1098" y="126" width="400" height="52" rx="8" fill="#FFFFFF" stroke="#1E40AF" stroke-width="1"/>
  <text x="1298" y="148" font-size="13.5" font-weight="700" fill="#0F172A" text-anchor="middle">模块导入</text>
  <text x="1298" y="167" font-size="11" fill="#475569" text-anchor="middle">ThreatIRSubAgent 门面编排</text>
  <line x1="780" y1="192" x2="780" y2="214" stroke="#1E40AF" stroke-width="2.2" marker-end="url(#an)"/>
  <rect x="40" y="216" width="1480" height="170" rx="12" fill="#EFF6FF" stroke="#1E40AF" stroke-width="1.5"/>
  <text x="64" y="245" font-size="15" font-weight="700" fill="#1E40AF">ingest 前置层（v2.0）</text>
  <text x="264" y="245" font-size="12" fill="#475569">多源安全数据文件 → 标准事件（确定性纯业务代码，不使用模型）</text>
  <rect x="64" y="258" width="344" height="72" rx="8" fill="#FFFFFF" stroke="#1E40AF" stroke-width="1"/>
  <text x="236" y="282" font-size="13" font-weight="700" fill="#0F172A" text-anchor="middle">FormatDetector</text>
  <text x="236" y="300" font-size="10.5" fill="#475569" text-anchor="middle">扩展名 + Magic + 内容正则 + Schema</text>
  <text x="236" y="316" font-size="10.5" fill="#475569" text-anchor="middle">多策略置信度识别</text>
  <line x1="408" y1="294" x2="422" y2="294" stroke="#1E40AF" stroke-width="2" marker-end="url(#an)"/>
  <rect x="424" y="258" width="344" height="72" rx="8" fill="#FFFFFF" stroke="#1E40AF" stroke-width="1"/>
  <text x="596" y="282" font-size="13" font-weight="700" fill="#0F172A" text-anchor="middle">ParserRegistry</text>
  <text x="596" y="300" font-size="10.5" fill="#475569" text-anchor="middle">23 个解析器插件</text>
  <text x="596" y="316" font-size="10.5" fill="#475569" text-anchor="middle">置信度 ≥ 0.45 择优</text>
  <line x1="768" y1="294" x2="782" y2="294" stroke="#1E40AF" stroke-width="2" marker-end="url(#an)"/>
  <rect x="784" y="258" width="344" height="72" rx="8" fill="#FFFFFF" stroke="#1E40AF" stroke-width="1"/>
  <text x="956" y="282" font-size="13" font-weight="700" fill="#0F172A" text-anchor="middle">Pipeline</text>
  <text x="956" y="300" font-size="10.5" fill="#475569" text-anchor="middle">批量处理流水线</text>
  <text x="956" y="316" font-size="10.5" fill="#475569" text-anchor="middle">parse_error 降级保真</text>
  <line x1="1128" y1="294" x2="1142" y2="294" stroke="#1E40AF" stroke-width="2" marker-end="url(#an)"/>
  <rect x="1144" y="258" width="344" height="72" rx="8" fill="#FFFFFF" stroke="#1E40AF" stroke-width="1"/>
  <text x="1316" y="282" font-size="13" font-weight="700" fill="#0F172A" text-anchor="middle">record_to_event</text>
  <text x="1316" y="300" font-size="10.5" fill="#475569" text-anchor="middle">字段映射 → 统一事件</text>
  <text x="1316" y="316" font-size="10.5" fill="#475569" text-anchor="middle">source_file + record_index 溯源</text>
  <text x="64" y="371" font-size="11" font-weight="700" fill="#1E40AF">支持格式：</text>
  <g font-size="11" fill="#1E40AF">
    <rect x="150" y="352" width="54" height="26" rx="13" fill="#FFFFFF" stroke="#1E40AF" stroke-width="1"/><text x="177" y="369" text-anchor="middle">pcap</text>
    <rect x="212" y="352" width="72" height="26" rx="13" fill="#FFFFFF" stroke="#1E40AF" stroke-width="1"/><text x="248" y="369" text-anchor="middle">pcapng</text>
    <rect x="292" y="352" width="72" height="26" rx="13" fill="#FFFFFF" stroke="#1E40AF" stroke-width="1"/><text x="328" y="369" text-anchor="middle">syslog</text>
    <rect x="372" y="352" width="50" height="26" rx="13" fill="#FFFFFF" stroke="#1E40AF" stroke-width="1"/><text x="397" y="369" text-anchor="middle">csv</text>
    <rect x="430" y="352" width="50" height="26" rx="13" fill="#FFFFFF" stroke="#1E40AF" stroke-width="1"/><text x="455" y="369" text-anchor="middle">cef</text>
    <rect x="488" y="352" width="52" height="26" rx="13" fill="#FFFFFF" stroke="#1E40AF" stroke-width="1"/><text x="514" y="369" text-anchor="middle">leef</text>
    <rect x="548" y="352" width="62" height="26" rx="13" fill="#FFFFFF" stroke="#1E40AF" stroke-width="1"/><text x="579" y="369" text-anchor="middle">idmef</text>
    <rect x="618" y="352" width="56" height="26" rx="13" fill="#FFFFFF" stroke="#1E40AF" stroke-width="1"/><text x="646" y="369" text-anchor="middle">misp</text>
    <rect x="682" y="352" width="54" height="26" rx="13" fill="#FFFFFF" stroke="#1E40AF" stroke-width="1"/><text x="709" y="369" text-anchor="middle">stix</text>
    <rect x="744" y="352" width="54" height="26" rx="13" fill="#FFFFFF" stroke="#1E40AF" stroke-width="1"/><text x="771" y="369" text-anchor="middle">yara</text>
    <rect x="806" y="352" width="54" height="26" rx="13" fill="#FFFFFF" stroke="#1E40AF" stroke-width="1"/><text x="833" y="369" text-anchor="middle">zeek</text>
    <rect x="868" y="352" width="84" height="26" rx="13" fill="#FFFFFF" stroke="#1E40AF" stroke-width="1"/><text x="910" y="369" text-anchor="middle">suricata</text>
    <rect x="960" y="352" width="80" height="26" rx="13" fill="#FFFFFF" stroke="#1E40AF" stroke-width="1"/><text x="1000" y="369" text-anchor="middle">netflow</text>
    <rect x="1048" y="352" width="54" height="26" rx="13" fill="#FFFFFF" stroke="#1E40AF" stroke-width="1"/><text x="1075" y="369" text-anchor="middle">json</text>
    <text x="1116" y="369" font-size="11" fill="#475569">…</text>
  </g>
  <line x1="780" y1="386" x2="780" y2="404" stroke="#EA580C" stroke-width="2.6" marker-end="url(#ao)"/>
